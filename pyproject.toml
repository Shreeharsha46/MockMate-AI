[project]
name = "mockmate"
version = "0.1.0"
description = "AI-Powered Technical Interview Agent — adaptive mock interviews with validated scorecards and persistent memory"
readme = "README.md"
authors = [
    { name = "openhands", email = "openhands@all-hands.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.1",
    "deepagents>=0.7.41",
    "langchain>=1.5.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
mockmate = "mockmate:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
